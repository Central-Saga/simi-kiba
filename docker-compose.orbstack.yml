services:
    mysql:
        image: 'docker.io/library/mysql:8.4'
        container_name: simi_kiba_mysql
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: 'password'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: 'simi-kiba'
            MYSQL_USER: 'sail'
            MYSQL_PASSWORD: 'password'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'simi_kiba_mysql:/var/lib/mysql'
        networks:
            - simi_kiba_network

    redis:
        image: 'docker.io/library/redis:alpine'
        container_name: simi_kiba_redis
        ports:
            - '6380:6379'
        volumes:
            - 'simi_kiba_redis:/data'
        networks:
            - simi_kiba_network

networks:
    simi_kiba_network:
        driver: bridge

volumes:
    simi_kiba_mysql:
        driver: local
    simi_kiba_redis:
        driver: local
